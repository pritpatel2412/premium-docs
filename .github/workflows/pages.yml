name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown pygments

      - name: Build Pages site and compile live demo showcases
        run: |
          mkdir -p _site/examples
          # Copy static showcase site
          cp -r site/* _site/
          # Compile official examples directly into the showcase site
          python skills/premium-docs/scripts/build_doc.py skills/premium-docs/examples/technical-report.md -o _site/examples/technical-report.html
          python skills/premium-docs/scripts/build_doc.py skills/premium-docs/examples/prd-feature-spec.md -o _site/examples/prd-feature-spec.html
          python skills/premium-docs/scripts/build_doc.py skills/premium-docs/examples/project-guide.md -o _site/examples/project-guide.html
          python skills/premium-docs/scripts/build_doc.py skills/premium-docs/examples/incident-postmortem.md -o _site/examples/incident-postmortem.html

      - name: Validate generated deliverables
        run: |
          python skills/premium-docs/scripts/validate_doc.py _site/examples/technical-report.html
          python skills/premium-docs/scripts/validate_doc.py _site/examples/prd-feature-spec.html
          python skills/premium-docs/scripts/validate_doc.py _site/examples/project-guide.html
          python skills/premium-docs/scripts/validate_doc.py _site/examples/incident-postmortem.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
