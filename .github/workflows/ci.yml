name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite
        run: |
          python -m pytest -v tests/

      - name: Test compiling all official examples
        run: |
          python skills/premium-docs/scripts/build_doc.py skills/premium-docs/examples/technical-report.md -o output/test-report.html
          python skills/premium-docs/scripts/build_doc.py skills/premium-docs/examples/prd-feature-spec.md -o output/test-prd.html
          python skills/premium-docs/scripts/build_doc.py skills/premium-docs/examples/project-guide.md -o output/test-guide.html
          python skills/premium-docs/scripts/build_doc.py skills/premium-docs/examples/incident-postmortem.md -o output/test-postmortem.html

      - name: Validate compiled example HTML deliverables
        run: |
          python skills/premium-docs/scripts/validate_doc.py output/test-report.html
          python skills/premium-docs/scripts/validate_doc.py output/test-prd.html
          python skills/premium-docs/scripts/validate_doc.py output/test-guide.html
          python skills/premium-docs/scripts/validate_doc.py output/test-postmortem.html

      - name: Test installer across all 8 platforms (Dry Run)
        run: |
          python install.py --target all --dry-run
